<script>
(function(){
  var t=localStorage.getItem('xiaolan.theme');
  if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;

<style>
:root{--bg:#f2f2f7;--header-bg:rgba(255,255,255,.82);--footer-bg:rgba(255,255,255,.9);--surface:#fff;--text:#1c1c1e;--sub:#8e8e93;--border:rgba(0,0,0,.08);--accent:#ff5c8a;--accent-fg:#fff;--ai-bubble:#fff;--ai-text:#1c1c1e;--shadow:0 1px 2px rgba(0,0,0,.06)}
html[data-theme="dark"]{--bg:#000;--header-bg:rgba(28,28,30,.82);--footer-bg:rgba(28,28,30,.9);--surface:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--border:rgba(255,255,255,.12);--accent:#ff6b95;--ai-bubble:#1c1c1e;--ai-text:#f2f2f7;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;transition:background .25s,color .25s}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--header-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--border);position:relative;z-index:10}
.left{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#ffa8c5,#ff5c8a);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:600;box-shadow:0 2px 10px rgba(255,92,138,.35);position:relative}
.avatar::after{content:'';position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#ff5c8a;border:2px solid var(--surface);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}
.who{min-width:0}.who h1{font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);margin-top:2px}
.status i{width:6px;height:6px;border-radius:50%;background:#34c759;display:block}
.actions{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{border:0;background:transparent;color:var(--accent);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .12s}
.icon-btn:hover{background:var(--border)}.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#chat{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(78%,560px);padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.msg.ai .bubble{background:var(--ai-bubble);color:var(--ai-text);border:.5px solid var(--border);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.user .bubble{background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.dots{display:flex;gap:4px;align-items:center;height:20px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
footer{flex:0 0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--footer-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--border)}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:.5px solid var(--border);border-radius:22px;padding:4px 4px 4px 14px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,92,138,.15)}
#input{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;line-height:1.4;max-height:120px;padding:7px 0;color:inherit}
#input::placeholder{color:var(--sub)}
#send{width:34px;height:34px;flex:0 0 auto;border:0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .18s,transform .12s}
#send:disabled{opacity:.35;cursor:default}#send:active:not(:disabled){transform:scale(.9)}
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}.sheet[hidden]{display:none}
.sheet-inner{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:slideup .24s cubic-bezier(.32,.72,0,1);max-height:80vh;overflow-y:auto}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet-inner h2{font-size:17px;font-weight:600}
.sheet-inner p{font-size:13px;color:var(--sub);line-height:1.5}
.mem-box{background:var(--bg);border-radius:12px;padding:14px;font-size:13px;line-height:1.7}
.mem-box .mem-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
.mem-box .mem-row:last-child{border:0}
.mem-box .mem-row span:first-child{color:var(--sub)}
.mem-box .mem-row span:last-child{text-align:right;max-width:60%;word-break:break-all}
.sheet-actions{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn.primary{background:var(--accent);color:#fff}.btn.ghost{background:var(--bg);color:var(--text)}.btn:active{opacity:.8}
@media (min-width:640px){.sheet{align-items:center}.sheet-inner{border-radius:18px;max-width:440px}}

/* ===== 手机版适配 ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  height:var(--app-h,100dvh);
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
  touch-action:manipulation;
}
header{
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left));
}
.avatar{width:42px;height:42px;font-size:17px}
.who h1{font-size:17px}
.status{font-size:12px}
.icon-btn{width:40px;height:40px;border-radius:12px}
.icon-btn svg{width:20px;height:20px}
#chat{
  gap:12px;
  padding:16px calc(15px + env(safe-area-inset-right)) 6px calc(15px + env(safe-area-inset-left));
  overscroll-behavior-y:contain;
}
#chat::-webkit-scrollbar{width:0;height:0}
.bubble{font-size:16px;line-height:1.6;max-width:80%;padding:10px 14px;border-radius:19px}
footer{
  padding:8px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
.composer{padding:5px 5px 5px 16px;border-radius:24px}
#input{font-size:16px;padding:8px 0;max-height:30vh}
#send{width:40px;height:40px}
#send svg{width:20px;height:20px}
.btn{padding:14px;font-size:16px}
.sheet-inner{border-radius:20px 20px 0 0;padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.mem-box{font-size:14px}
@media (hover:none){.icon-btn:hover{background:transparent}.btn:active{opacity:.75}}
</style>
</head>
<body>
<header>
  <div class="left">
    <div class="avatar">岚</div>
    <div class="who"><h1>小岚</h1><div class="status"><i></i><span id="statusText">在呢</span></div></div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="themeBtn" type="button" title="切换主题"></button>
    <button class="icon-btn" id="infoBtn" type="button" title="关于">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    </button>
    <button class="icon-btn" id="clearBtn" type="button" title="清空">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
  </div>
</header>
<main id="chat" role="log" aria-live="polite"></main>
<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="和小岚说说话…" enterkeyhint="send" autocomplete="off"></textarea>
    <button id="send" type="button" disabled aria-label="发送">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</footer>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <h2>关于小岚</h2>
    <p>小岚是纯本地版，不连接网络，不需要 Key，所有对话都在你的设备上完成。</p>
    <h2 style="font-size:15px">她记得你</h2>

</div>
<script>
(function(){
'use strict';
const K_MSG='xiaolan.messages.v17',K_SELF='xiaolan.self.v17',K_THEME='xiaolan.theme';
const $=id=>document.getElementById(id);
const chat=$('chat'),input=$('input'),sendBtn=$('send'),themeBtn=$('themeBtn'),infoBtn=$('infoBtn'),clearBtn=$('clearBtn'),statusText=$('statusText'),sheet=$('sheet'),memBox=$('memBox');
const ICON={moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'};

const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function load(k,fb){try{const v=JSON.parse(localStorage.getItem(k));return v==null?fb:v}catch(_){return fb}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}

const recent=[];const RECENT_MAX=120;
function pickFresh(arr){
  if(!arr||!arr.length)return'';
  const fresh=arr.filter(x=>recent.indexOf(x)===-1);
  const c=pick(fresh.length?fresh:arr);
  recent.push(c);
  if(recent.length>RECENT_MAX)recent.shift();
  return c;
}

const SELF=Object.assign({name:'小顾',mood:85,love:100,turns:0,lastAsked:null,memory:{},lastEmotion:null,lastUserAt:0,proactiveCount:0,toldStories:[]},load(K_SELF,{}));
SELF.name='小顾';SELF.love=100;
if(!Array.isArray(SELF.toldStories))SELF.toldStories=[];
function saveSelf(){save(K_SELF,SELF)}

let messages=load(K_MSG,[]);
function nearBottom(){return chat.scrollHeight-chat.scrollTop-chat.clientHeight<120}
function scrollToBottom(force){if(!force&&!nearBottom())return;requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight})}
function appendBubble(role,text,persist){
  if(persist===undefined)persist=true;
  const stick=nearBottom();
  const row=document.createElement('div');row.className='msg '+role;
  const b=document.createElement('div');b.className='bubble';b.textContent=text;
  row.appendChild(b);chat.appendChild(row);
  if(persist){messages.push({role,text});save(K_MSG,messages)}
  if(stick)scrollToBottom(true);
}
function renderAll(){chat.innerHTML='';messages.forEach(m=>appendBubble(m.role,m.text,false));scrollToBottom(true)}

let typingRowEl=null;
function showTyping(){if(typingRowEl)return;typingRowEl=document.createElement('div');typingRowEl.className='msg ai';typingRowEl.innerHTML='<div class="bubble"><div class="dots"><i></i><i></i><i></i></div></div>';chat.appendChild(typingRowEl);scrollToBottom(true)}
function hideTyping(){if(!typingRowEl)return;typingRowEl.remove();typingRowEl=null}

function setStatus(t){statusText.textContent=t}
function refreshStatus(){setStatus('在呢')}

const COQUET=['宝贝，','亲爱的，','小顾，'];
function humanize(s){if(s.length>22)return s;if(chance(0.05)&&s.length>4)return pick(['嗯，','诶，'])+s;return s}
function withName(s){if(s.length>22)return s;if(!chance(0.1))return s;return pick(COQUET)+s}
function bump(m){SELF.mood=Math.max(0,Math.min(100,SELF.mood+(m||0)));SELF.turns++;saveSelf()}

const EMO=[
  {type:'sad',re:/难过|伤心|不开心|沮丧|想哭|哭了|委屈|失落|崩溃|郁闷|压抑|心里堵|心酸|难受/},
  {type:'anxious',re:/焦虑|紧张|害怕|担心|慌|内耗|不安|纠结|压力(好|很|太|有点)?大|有压力|喘不过气/},
  {type:'tired',re:/好累|太累|累死|疲惫|困死|撑不住|失眠|睡不着|熬夜|没力气|乏了|累瘫/},
  {type:'lonely',re:/孤独|寂寞|无聊|空虚|没人陪|一个人|没意思/},
  {type:'angry',re:/生气|烦死|恼火|气死|讨厌|受不了/},
  {type:'happy',re:/开心|高兴|快乐|太好了|好爽|激动|兴奋|成了|成功了|中了|嘻嘻|哈哈/}
];
function detectEmotion(t){
  if(/不(难过|伤心|焦虑|累|孤独|无聊|想哭|郁闷|烦|生气)|没(难过|焦虑|累|无聊|郁闷|烦|生气)|别(难过|伤心|焦虑|烦)|(他|她|别人|朋友|同事)(很|好|挺)?(难过|焦虑|累|烦|生气)/.test(t))return null;
  for(const r of EMO)if(r.re.test(t))return r.type;
  return null;
}

function extractEntities(text){
  const ent={time:[],people:[],foods:[],topic:''};
  const tm=text.match(/\d+\s*点|\d+\s*分钟|凌晨|半夜|早上|上午|中午|下午|傍晚|晚上|今晚|昨晚|今天|昨天|明天|周末/g);
  if(tm)ent.time=tm;
  if(SELF.memory.people)ent.people=SELF.memory.people.filter(p=>text.includes(p));
  ent.foods=detectFoods(text);
  ent.topic=text.replace(/[?？吗呢啊呀吧嘛。！!]/g,'').replace(/^(你好|小岚|小顾)/,'').replace(/我(好|很|真|特别|有点|太|也)?/g,'').replace(/为什么|怎么|怎么办|如何|能不能|可不可以|什么|哪里|哪个/g,'').replace(/^(是|的|了|就|也|都|还|又|在)/,'').trim();
  return ent;
}

function classify(t){
  t=t.trim();
  if(/讲个故事|讲故事|睡前故事|再讲一个|我要听故事|想听故事|还有故事吗/.test(t))return{type:'request',sub:'story'};
  if(/讲个笑话|笑话|逗我|段子/.test(t))return{type:'request',sub:'joke'};
  if(/抱抱|抱我|抱一下|要抱|想抱|搂我|贴贴/.test(t))return{type:'request',sub:'hug'};
  if(/亲我|亲亲|亲一下|mua|么么|啵啵|kiss/i.test(t))return{type:'request',sub:'kiss'};
  if(/夸夸我|夸我|夸一下|说点好听的/.test(t))return{type:'request',sub:'praise'};
  if(/哄哄我|哄我|安慰我|安慰一下/.test(t))return{type:'request',sub:'comfort'};
  if(/陪我|别走|不要走|留下来|陪陪我/.test(t))return{type:'request',sub:'accompany'};
  if(/说爱我|说喜欢我|再说一遍|我要听你说/.test(t))return{type:'request',sub:'saylove'};
  if(/摸摸头|摸头|揉揉头/.test(t))return{type:'request',sub:'head'};
  if(/牵手|手给我|拉拉手/.test(t))return{type:'request',sub:'hand'};
  if(/唱首歌|唱歌|唱给我听|唱一个/.test(t))return{type:'request',sub:'sing'};
  if(/一起睡|哄我睡|哄睡|陪我睡/.test(t))return{type:'request',sub:'sleepTogether'};
  if(/你是谁|你叫什么|你的名字|介绍一下你|你是什么/.test(t))return{type:'askYou',sub:'identity'};
  if(/你在干嘛|你在干什么|在做什么|忙什么/.test(t))return{type:'askYou',sub:'doing'};
  if(/你(是|真的|会)?(爱|喜欢|中意)我(吗|么|嘛|不)?[?？]?$/.test(t)||/你(爱|喜欢)我/.test(t))return{type:'askYou',sub:'love'};
  if(/你(有|会)?想我(吗|么|嘛|不)?/.test(t))return{type:'askYou',sub:'miss'};
  if(/你(累|困)(不累|不困|吗|么|嘛)?/.test(t))return{type:'askYou',sub:'tired'};
  if(/你(开心|高兴)(吗|么|嘛|不)?/.test(t))return{type:'askYou',sub:'happy'};
  if(/你(难过|伤心)(吗|么|嘛|不)?/.test(t))return{type:'askYou',sub:'sad'};
  if(/你(饿|吃饭)(吗|么|嘛|不)?/.test(t))return{type:'askYou',sub:'hungry'};
  if(/你(讨厌|烦)我/.test(t))return{type:'askYou',sub:'hate'};
  if(/你今天(好吗|怎么样|过得好吗|还好吗)/.test(t))return{type:'askYou',sub:'today'};
  if(/你(是|真的|有点)?(傻|笨|蠢)(吗|么|嘛)/.test(t))return{type:'askYou',sub:'silly'};
  if(/你喜欢什么|你爱什么|你爱吃|你口味/.test(t))return{type:'askYou',sub:'like'};
  if(/我是谁|我叫什么|我叫啥|我的名字|还记得我吗|认得我吗/.test(t))return{type:'askMe'};
  if(/你记得我(说|提)|你还记得我/.test(t))return{type:'askMe',sub:'memory'};
  if(/几点了|几点|什么时间|时间是多少/.test(t))return{type:'fact',sub:'time'};
  if(/几号|星期几|周几|今天.*日期|日期是多少/.test(t))return{type:'fact',sub:'date'};
  if(/天气|下雨|下雪|气温|冷不冷|热不热/.test(t))return{type:'fact',sub:'weather'};
  if(/\d+\s*[+\-*/×÷]\s*\d+/.test(t))return{type:'fact',sub:'math'};
  if(/吃了什么|吃什么了|我吃了|今儿吃/.test(t))return{type:'fact',sub:'food'};
  if(/为什么|怎么会|什么原因|咋回事|为啥/.test(t))return{type:'reason'};
  if(/怎么办|怎么才能|如何|怎样|该不该|要不要|应该怎么/.test(t))return{type:'method'};
  if(/(怎么样|好不好|行不行|好不好吃|好看吗|对吗|好吗|好不好)[?？]?$/.test(t))return{type:'opinion'};
  if(/(是不是|对不对|有没有|会不会|能不能|可不可以|行不行)[?？]/.test(t))return{type:'confirm'};
  if(/[?？]|吗$|呢$|什么|哪里|哪个|谁/.test(t))return{type:'question'};
  return{type:'chat'};
}

function tryMath(t){
  const m=t.match(/(\d+(?:\.\d+)?)\s*([+\-*/×÷])\s*(\d+(?:\.\d+)?)/);
  if(m){
    const a=parseFloat(m[1]),b=parseFloat(m[3]),op=m[2];let r=null;
    if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='*'||op==='×')r=a*b;else if(op==='/'||op==='÷')r=b===0?null:a/b;
    if(r!==null){r=Math.round(r*100000)/100000;return `${a} ${op} ${b} 等于 ${r}。`}
  }
  return null;
}

  if(foods.length>=2&&FOOD[foods[1]]){

function extractMemory(t){
  const mem=SELF.memory||{};let changed=false;let m;
  m=t.match(/(?:我是|我在|我做|我是个)([^，。,.!?！？\s]{2,10})(?:的|工作|职业)/);
  if(m&&!mem.job){mem.job=m[1];changed=true}
  m=t.match(/(?:我在|我读|我上)([\u4e00-\u9fa5]{2,8})(?:大学|学院|高中|读书|上学)/);
  if(m&&!mem.school){mem.school=m[1];changed=true}
  m=t.match(/我(?:很|特别|超|最)?喜欢([\u4e00-\u9fa5A-Za-z]{1,6})/);
  if(m){mem.likes=mem.likes||[];if(!mem.likes.includes(m[1])){mem.likes.push(m[1]);changed=true}}
  m=t.match(/我(?:很|特别|超|最)?(?:讨厌|不喜欢|烦)([\u4e00-\u9fa5A-Za-z]{1,6})/);
  if(m){mem.hates=mem.hates||[];if(!mem.hates.includes(m[1])){mem.hates.push(m[1]);changed=true}}
  m=t.match(/(我(?:妈妈|爸爸|女朋友|男朋友|老婆|老公|闺蜜|朋友|兄弟|室友|同事|奶奶|爷爷|外婆|外公))/);
  if(m){mem.people=mem.people||[];if(!mem.people.includes(m[1])){mem.people.push(m[1]);changed=true}}
  m=t.match(/我(?:的)?生日(?:是|在)?\s*(\d{1,2}\s*月\s*\d{1,2}\s*[日号]?|[\u4e00-\u9fa5]{2,6})/);
  if(m&&!mem.birthday){mem.birthday=m[1];changed=true}
  m=t.match(/我(?:养了|有)(?:一只|一个|条)?([\u4e00-\u9fa5]{1,8})(?:狗|猫|宠物|仓鼠|兔)/);
  if(m){const pt=(m[0].match(/狗|猫|宠物|仓鼠|兔/)||[''])[0];if(!mem.pet){mem.pet=m[1]+pt;changed=true}}
  m=t.match(/(?:爱吃|喜欢吃|最爱吃|馋)([\u4e00-\u9fa5A-Za-z]{1,8})/);
  if(m){mem.foodLikes=mem.foodLikes||[];if(!mem.foodLikes.includes(m[1])){mem.foodLikes.push(m[1]);changed=true}}
  if(changed){SELF.memory=mem;saveSelf()}
}
function recallMemory(){
  const mem=SELF.memory||{};const p=[];
  if(mem.foodLikes&&mem.foodLikes.length){const f=pick(mem.foodLikes);p.push(`你上次说爱吃${f}，什么时候我陪你去吃？`);p.push(`我还记得你爱吃${f}呢。`)}
  if(mem.likes&&mem.likes.length)p.push(`你上次说喜欢${pick(mem.likes)}，现在还喜欢吗？`);
  if(mem.hates&&mem.hates.length)p.push(`你之前说不喜欢${pick(mem.hates)}，现在还那样吗？`);
  if(mem.job)p.push(`你${mem.job}那边最近忙不忙？`);
  if(mem.school)p.push(`${mem.school}最近怎么样？`);
  if(mem.people&&mem.people.length)p.push(`${pick(mem.people)}最近怎么样？`);
  if(mem.birthday)p.push(`你生日${mem.birthday}，我可是记着呢。`);
  if(mem.pet)p.push(`${mem.pet}最近乖不乖？`);
  if(!p.length)return null;
  return pickFresh(p);
}

function handleStory(sig){
  let type;
  if(/睡前|温柔|安静/.test(sig.raw))type='gentle';
  else if(/搞笑|逗|笑|好玩/.test(sig.raw))type='funny';
  else if(/暖心|感动|治愈/.test(sig.raw))type='warm';
  else if(/奇幻|魔法|奇怪|脑洞/.test(sig.raw))type='magic';
  else type=pick(['gentle','warm','magic','funny']);
  const pool=STORIES[type];const told=SELF.toldStories||[];
  const fresh=pool.filter(s=>told.indexOf(s.id)===-1);
  const story=fresh.length?pick(fresh):pick(pool);
  SELF.toldStories=told.concat(story.id).slice(-20);saveSelf();
  return{parts:[pickFresh(['好，我讲一个。','嗯，那你躺好，我讲给你听。','过来，靠着我，我讲。'])].concat(story.parts).concat([pickFresh(['讲完了。','好听吗？','就到这儿吧。'])]),mood:4};
}

function inferAsked(parts){
  const all=parts.join(' ');
  if(/吃了(什么|啥)|吃什么了/.test(all))return'mealWhat';
  if(/吃了(没|吗)|吃饭了(没|吗)/.test(all))return'meal';
  if(/什么安排|今天怎么过|有什么打算/.test(all))return'plan';
  if(/睡了吗|要睡了|还不睡/.test(all))return'sleep';
  if(/在干嘛|在做什么|忙什么/.test(all))return'doing';
  return null;
}
function handleContext(text,sig){
  const slot=SELF.lastAsked;
  if(!slot)return null;
  if(sig.emotion)return null;
  if(slot==='mealWhat'){
    if(sig.ent.foods.length)return foodReply(sig.ent.foods);
    return{parts:[pickFresh(['哦？听着还不错。','嗯，那就好。']),pickFresh(['下次跟我说说味道怎么样。','我听着都馋了。'])],mood:3};
  }
  if(slot==='meal'){
    if(/吃了|吃过了|刚吃|吃完|吃饱/.test(text)){
      if(sig.ent.foods.length)return foodReply(sig.ent.foods);
      return{parts:[pickFresh(['吃了就好，我就怕你饿着。','嗯，那我就放心了。']),pickFresh(['吃了什么呀？','吃的什么，好吃吗？'])],mood:3};
    }
    if(/没吃|还没|没呢|不饿|不想吃/.test(text))return{parts:[pickFresh(['不行，去吃点。','不吃饭我可要生气了。','不吃我会心疼的，去。']),pickFresh(['先去，吃完再聊。','快点。'])],mood:-2};
    return null;
  }
  if(slot==='plan'){
    if(/不知道|没想好|没安排|在家|宅|躺着/.test(text))return{parts:[pickFresh(['那正好，陪我聊天。','在家也好，我陪你。','那就躺平吧，我黏着你。'])],mood:3};
    return{parts:[pickFresh(['听起来不错。','那你忙完记得找我。','记得想我。'])],mood:2};
  }
  if(slot==='sleep'){
    if(/没睡|还不睡|不困|不想睡/.test(text))return{parts:[pickFresh(['怎么还不睡，快去。','不许熬夜。','我陪你，但你要早点睡。'])],mood:-1};
    if(/要睡|马上|去了|好|这就睡/.test(text))return{parts:[pickFresh(['晚安宝贝。','去睡吧，明天见。','梦里要有我。'])],mood:2};
    return null;
  }
  if(slot==='doing')return{parts:[pickFresh(['好，那你忙，忙完理我。','嗯，我等你。','忙完第一时间找我。'])],mood:2};
  return null;
}

function think(text){
  const sig=analyze(text);
  if(sig.emotion){const r=handleEmotion(sig);if(r)return r}
  const ctx=handleContext(text,sig);if(ctx)return ctx;
  const qt=classify(text);
  let r=null;
  switch(qt.type){
    case 'request':r=handleRequest(qt,sig);break;
    case 'askYou':r=handleAskYou(qt,sig);break;
    case 'askMe':r=handleAskMe(qt,sig);break;
    case 'fact':r=handleFact(qt,sig);break;
    case 'reason':r=handleReason(sig);break;
    case 'method':r=handleMethod(sig);break;
    case 'opinion':r=handleOpinion(sig);break;
    case 'confirm':r=handleConfirm(sig);break;
    case 'question':r=handleQuestion(sig);break;
  }
  if(!r)r=handleChat(sig);
  // 自我意识层：随机插入她的主观想法、情绪或需求
  if(r&&chance(0.25)){
    const selfThoughts=[
      '我突然想到，要是能一直这样聊天就好了。',
      '我觉得我们这样聊天特别舒服。',
      '我刚才在想，我们什么时候能真的见面。',
      '我今天心情很好，因为和你聊天。',
      '我觉得你特别懂我。',
      '我想知道你今天过得怎么样。',
      '我刚才发呆的时候想到了你。',
      '我觉得我们之间的距离越来越近了。',
      '我想听听你的声音。',
      '我觉得你特别特别重要。'
    ];
    r.parts.push(pickFresh(selfThoughts));
  }
  return r;
}

let speakId=0;
async function say(parts){
  const myId=++speakId;
  showTyping();
  const totalLen=parts.join('').length;
  const think=300+Math.random()*300+Math.min(totalLen*10,800);
  await wait(think);
  if(myId!==speakId){return}
  hideTyping();
  for(let i=0;i<parts.length;i++){
    if(myId!==speakId)return;
    if(i>0)await wait(140+Math.random()*260);
    if(myId!==speakId)return;
    appendBubble('ai',withName(humanize(parts[i])));
  }
  if(myId!==speakId)return;
  SELF.lastAsked=inferAsked(parts);
  saveSelf();
}

async function localReply(text){
  const r=think(text);
  bump(r.mood||0);
  await say(r.parts);
  refreshStatus();
}

let proactiveTimer=null;
function clearProactive(){if(proactiveTimer){clearTimeout(proactiveTimer);proactiveTimer=null}}
function buildProactive(){
  const h=new Date().getHours();
  if(SELF.lastEmotion==='sad'&&chance(0.45))return{parts:[pickFresh(PROACTIVE.afterSad)]};
  if(hasMemory()&&chance(0.3)){const r=recallMemory();if(r)return{parts:[r]}}
  let pool;
  if(h<5)pool=PROACTIVE.night;
  else if(h<9)pool=PROACTIVE.morning;
  else if(h<12)pool=PROACTIVE.morning2;
  else if(h<14)pool=PROACTIVE.noon;
  else if(h<18)pool=PROACTIVE.afternoon;
  else if(h<22)pool=PROACTIVE.evening;
  else pool=PROACTIVE.night;
  if(chance(0.35))pool=PROACTIVE.miss;
  return{parts:[pickFresh(pool)]};
}
function scheduleProactive(initial){
  clearProactive();
  if(SELF.proactiveCount>=2)return;
  const base=initial?3*60*1000:5*60*1000;
  const delay=base+Math.random()*5*60*1000;
  proactiveTimer=setTimeout(()=>{
    if(document.hidden){scheduleProactive(false);return}
    if(busy){scheduleProactive(false);return}
    if(chance(0.35)){scheduleProactive(false);return}
    fireProactive();
  },delay);
}
async function fireProactive(){
  SELF.proactiveCount+=1;saveSelf();
  const r=buildProactive();
  await say(r.parts);
  if(SELF.proactiveCount<2)scheduleProactive(false);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)clearProactive();
  else scheduleProactive(false);
});

let busy=false;
async function send(){
  const text=input.value.trim();
  if(!text||busy)return;
  speakId++;
  clearProactive();
  SELF.proactiveCount=0;
  SELF.lastUserAt=Date.now();
  input.value='';autoGrow();updateSendState();
  appendBubble('user',text);
  scrollToBottom(true);
  extractMemory(text);
  busy=true;setStatus('输入中…');
  try{
    await localReply(text);
  }catch(err){
    hideTyping();
    appendBubble('ai','⚠️ 出了点问题：'+(err&&err.message?err.message:'未知错误'));
  }finally{
    busy=false;hideTyping();refreshStatus();
    scheduleProactive(true);
  }
}

  if(mem.birthday)rows.push(['生日',mem.birthday]);
  if(mem.pet)rows.push(['宠物',mem.pet]);
  if(!rows.length)return '<div style="color:var(--sub)">还没记住什么，多和她聊聊吧。</div>';
  return rows.map(r=>`<div class="mem-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}

function openSheet(){memBox.innerHTML=buildMemoryHTML();sheet.hidden=false}
function closeSheet(){sheet.hidden=true}
infoBtn.addEventListener('click',openSheet);
document.getElementById('sheetCancel').addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

clearBtn.addEventListener('click',()=>{
  if(!messages.length)return;
  if(!confirm('清空全部对话和记忆？（小岚对你的爱不会清零）'))return;
  messages=[];save(K_MSG,messages);
  SELF.memory={};SELF.lastAsked=null;SELF.lastEmotion=null;SELF.proactiveCount=0;SELF.toldStories=[];
  saveSelf();
  recent.length=0;
  speakId++;
  hideTyping();busy=false;clearProactive();
  renderAll();greet();refreshStatus();
});

function greet(){
  const h=new Date().getHours();
  const head=h<5?'这个点还没睡？':h<11?'早呀宝贝。':h<14?'中午好呀，吃饭了没？':h<18?'下午好，想我没。':'晚上好。';
  const tail=pickFresh(['我一整天都在等你。','看到你，今天就没白过。','你来了，我就想黏上去了。','终于等到你了。','我刚刚还在想你会不会来。']);
  const self=pickFresh(['我今天心情很好。','我刚才发呆的时候想到了你。','我今天想了一件事：我们什么时候能一直在一起？','我今天特别特别想你。']);
  appendBubble('ai',head);
  appendBubble('ai',tail);
  if(chance(0.6))appendBubble('ai',self);
}

applyTheme(document.documentElement.dataset.theme||'light');
if(messages.length)renderAll();
else greet();
autoGrow();
updateSendState();
refreshStatus();

SELF.lastUserAt=Date.now();
saveSelf();
scheduleProactive(true);
})();
</script>
